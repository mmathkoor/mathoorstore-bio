<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{--u:12px;--g:#f5a623;--n:#0b1b3a;--n2:#14305c;--t:#e8eefc;--m:#a3b3d1}
*{box-sizing:border-box;letter-spacing:0!important}
html,body{height:100%;margin:0;background:#050d20;color:var(--t);font-family:'Tajawal',sans-serif;overflow:hidden}
#top{position:fixed;inset:0 0 auto 0;height:48px;z-index:5}
#stage{position:fixed;inset:48px 0 56px 0;perspective:1600px;overflow:hidden}
#bar{position:fixed;inset:auto 0 0 0;height:56px;z-index:5}
.slide{position:absolute;inset:6px;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;opacity:0;pointer-events:none;
 background:radial-gradient(#ffffff10 1px,transparent 1.6px) 0 0/22px 22px,radial-gradient(circle at 12% 0,#f5a62324,transparent 40%),linear-gradient(135deg,var(--n),var(--n2));border:1px solid #ffffff14;
 transform:translate3d(-60%,0,-500px) rotateY(40deg) rotateZ(-4deg) scale(.7);transition:transform .9s cubic-bezier(.7,0,.2,1),opacity .6s}
.slide.before{transform:translate3d(60%,0,-500px) rotateY(-40deg) rotateZ(4deg) scale(.7)}
.slide.active{opacity:1;pointer-events:auto;transform:none}
.sh{padding:clamp(14px,calc(var(--u)*2),28px) clamp(14px,calc(var(--u)*3),40px) 0}
.chip{display:inline-block;background:#f5a62326;color:var(--g);border:1px solid #f5a62366;border-radius:99px;padding:2px 12px;font-size:clamp(11px,calc(var(--u)*1.1),14px);font-weight:700}
h2{margin:8px 0 0;font-size:clamp(21px,calc(var(--u)*3.2),42px);font-weight:800;line-height:1.3}
h2::after{content:'';display:block;width:64px;height:4px;border-radius:4px;background:var(--g);margin-top:10px}
.sb{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:clamp(10px,calc(var(--u)*1.2),18px);padding:clamp(10px,calc(var(--u)*1.5),20px) clamp(14px,calc(var(--u)*3),40px)}
.sb::before,.sb::after{content:'';margin:auto}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,calc(var(--u)*20)),1fr));gap:clamp(8px,calc(var(--u)*1.1),16px)}
.cd{background:#ffffff0e;border:1px solid #ffffff1c;border-radius:14px;padding:clamp(11px,calc(var(--u)*1.3),20px)}
.cd i{color:var(--g);font-size:clamp(15px,calc(var(--u)*1.6),23px);width:2.3em;height:2.3em;border-radius:50%;background:#f5a6221f;border:1px solid #f5a62344;display:grid;place-items:center;margin-bottom:8px}
h3{margin:0 0 3px;font-size:clamp(15px,calc(var(--u)*1.7),22px);font-weight:700}
p{margin:0;font-size:clamp(12.5px,calc(var(--u)*1.3),17px);line-height:1.75;color:var(--m)}
p b{color:#fff}
.st{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,calc(var(--u)*26)),1fr));gap:clamp(8px,calc(var(--u)*1.1),16px)}
.st li{display:flex;gap:12px;align-items:flex-start;background:#ffffff0a;border-radius:14px;padding:clamp(10px,calc(var(--u)*1.2),18px);border-right:4px solid var(--g)}
.st li>b{flex:none;width:clamp(28px,calc(var(--u)*2.8),38px);height:clamp(28px,calc(var(--u)*2.8),38px);border-radius:50%;background:var(--g);color:var(--n);display:grid;place-items:center;font-weight:800}
.tp{display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,#f5a62333,#f5a62310);border:1px solid #f5a62355;border-radius:14px;padding:clamp(10px,calc(var(--u)*1.2),18px)}
.tp i{color:var(--g);font-size:clamp(18px,calc(var(--u)*2),28px)}.tp p{color:var(--t)}
.sf{display:flex;justify-content:space-between;gap:10px;padding:8px clamp(14px,calc(var(--u)*3),40px);border-top:1px solid #ffffff18;font-size:clamp(10px,calc(var(--u)*1),13px);color:var(--m);background:#0000002e}
.cv{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.cv h1{margin:0;font-size:clamp(28px,calc(var(--u)*5.4),70px);font-weight:800;line-height:1.3}
.cv h1 span{color:var(--g)}.cv i.big{font-size:clamp(40px,calc(var(--u)*6),80px);color:var(--g)}
.cv p{font-size:clamp(14px,calc(var(--u)*1.7),23px)}
a.cd{display:block;color:inherit;text-decoration:none;transition:border-color .2s,background .2s}
a.cd:hover,a.cd:focus-visible{border-color:var(--g);background:#f5a62320;outline:none}
a.cd p:last-child{margin-top:6px}a.cd p b{color:var(--g)}
/* animations */
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.05)}100%{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bnc{0%{opacity:0;transform:translateY(-30px)}55%{opacity:1;transform:translateY(8px)}75%{transform:translateY(-4px)}100%{transform:none}}
.slide.active .a{animation:fade .7s both;animation-delay:calc(var(--i)*110ms + 500ms)}
.slide.active .cd:nth-child(2n),.slide.active .st li:nth-child(2n){animation-name:pop}
.slide.active .cd:nth-child(3n),.slide.active .st li:nth-child(3n){animation-name:bnc}
.slide:not(.active) .a{opacity:0}
@media(prefers-reduced-motion:reduce){.slide,.slide.active .a{transition:none;animation:none!important}}
/* PDF mode */
.slide.pdf{position:relative;inset:auto;width:1123px;height:794px;opacity:1;transform:none;transition:none;border-radius:0;border:0}
.pdf .a{animation:none!important;opacity:1!important}.pdf .sb{overflow:hidden}
.slide::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(270deg,var(--g),#f5a62300);z-index:1}
.url{direction:ltr;text-align:right;color:var(--g)!important;font-weight:700;font-size:clamp(11px,calc(var(--u)*1.1),14px)!important;word-break:break-all}
.pills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.pills span{background:#ffffff12;border:1px solid #ffffff26;border-radius:99px;padding:6px 14px;font-size:clamp(12px,calc(var(--u)*1.2),16px);font-weight:700}
.pills i{color:var(--g)}
/* تخطيط PDF ثابت (A4 بالعرض) يُضبط تلقائياً حتى لا يتجاوز المحتوى الصفحة */
.pdf .sh{padding:30px 48px 0}.pdf h2{font-size:calc(34px*var(--f,1))}.pdf .chip{font-size:13px}
.pdf .sb{padding:calc(18px*var(--f,1)) 48px;gap:calc(14px*var(--f,1))}
.pdf .g,.pdf .st{gap:calc(12px*var(--f,1))}
.pdf .cd{padding:calc(16px*var(--f,1))}.pdf .st li{padding:calc(14px*var(--f,1))}
.pdf h3{font-size:calc(18px*var(--f,1))}.pdf p{font-size:calc(14px*var(--f,1));line-height:1.7}
.pdf .cd i{font-size:calc(17px*var(--f,1))}.pdf .st li>b{width:calc(34px*var(--f,1));height:calc(34px*var(--f,1))}
.pdf .tp{padding:calc(14px*var(--f,1))}.pdf .url{font-size:12px!important}
.pdf .sf{padding:10px 48px;font-size:12px}
.pdf .cv h1{font-size:62px}.pdf .cv p{font-size:22px}.pdf .cv i.big{font-size:70px}.pdf .pills span{font-size:16px}
#host{position:fixed;left:-12000px;top:0;width:1123px;height:794px;pointer-events:none}
.btn{background:#ffffff14;border:1px solid #ffffff26;color:var(--t);border-radius:12px;height:38px;min-width:38px;padding:0 12px;cursor:pointer;font-family:inherit;font-weight:700}
.btn:hover{background:#ffffff26}.gold{background:var(--g);color:var(--n);border:0}.gold:hover{background:#ffb93f}
#prog{flex:1;height:6px;border-radius:9px;background:#ffffff1f;overflow:hidden}#fill{height:100%;width:0;background:var(--g);transition:width .5s}
</style>
</head>
<body>
<div id="top" class="flex items-center justify-between px-3">
  <span class="font-bold text-sm"><i class="fa-solid fa-store" style="color:var(--g)"></i> دليلك الشامل للتجارة الإلكترونية</span>

</div>
<div id="stage"></div>
<div id="bar" class="flex items-center gap-3 px-3">

  <div id="prog"><div id="fill"></div></div>
  <span id="cnt" class="text-sm font-bold" style="min-width:48px;text-align:center"></span>
  <button id="next" class="btn gold" aria-label="التالي"><i class="fa-solid fa-chevron-left"></i></button>
</div>
<div id="host"></div>

 ?`<div class="g">${items.map(card).join('')}</div>`

pages.forEach((h,i)=>{const s=document.createElement('section');s.className='slide';s.innerHTML=h+foot(i);

const S=[...stage.children];let cur=0;
function go(n){cur=Math.max(0,Math.min(S.length-1,n));
 S.forEach((s,i)=>s.className='slide'+(i<cur?' before':i==cur?' active':''));
 document.getElementById('fill').style.width=((cur+1)/S.length*100)+'%';
 document.getElementById('cnt').textContent=(cur+1)+'/'+S.length;
 S[cur].querySelector('.sb').scrollTop=0}
const fit=()=>document.documentElement.style.setProperty('--u',Math.max(stage.clientWidth/100,3.9)+'px');
addEventListener('resize',fit);fit();go(0);
prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.key=='ArrowLeft'||e.key==' ')go(cur+1);if(e.key=='ArrowRight')go(cur-1)});
let x0,y0;
stage.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
 if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.3)go(dx>0?cur+1:cur-1)},{passive:true});

// يصغّر الخطوط والمسافات تدريجياً حتى يتسع المحتوى داخل صفحة A4 دون قص
function fitPdf(c){let f=1;const sb=c.querySelector('.sb');c.style.setProperty('--f',1);
 while(sb.scrollHeight>sb.clientHeight+2&&f>.5){f-=.04;c.style.setProperty('--f',f.toFixed(2))}}
// تصدير PDF بمقاس A4 بالعرض
pdfBtn.onclick=async()=>{
 const btn=pdfBtn,old=btn.innerHTML;btn.disabled=true;
 try{
  await document.fonts.ready;
  const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const host=document.getElementById('host');
  for(let i=0;i<S.length;i++){
   btn.textContent=`جارٍ التحويل ${i+1}/${S.length}`;
   host.innerHTML='';
   const c=S[i].cloneNode(true);c.className='slide pdf';host.appendChild(c);
   c.querySelectorAll('.g').forEach(g=>{const n=g.children.length;g.style.gridTemplateColumns=`repeat(${n<=4?n:n<=6?3:4},1fr)`});
   c.querySelectorAll('.st').forEach(o=>o.style.gridTemplateColumns='repeat(2,1fr)');
   fitPdf(c);
   await new Promise(r=>setTimeout(r,80));
   const cv=await html2canvas(c,{scale:1.6,backgroundColor:'#0b1b3a',useCORS:true,width:1123,height:794,windowWidth:1123,windowHeight:794,scrollX:0,scrollY:0});
   if(i)pdf.addPage();
   pdf.addImage(cv.toDataURL('image/jpeg',.88),'JPEG',0,0,297,210);
   const cr=c.getBoundingClientRect(),k=297/1123;
   c.querySelectorAll('a.cd').forEach(a=>{const r=a.getBoundingClientRect();pdf.link((r.left-cr.left)*k,(r.top-cr.top)*k,r.width*k,r.height*k,{url:a.href})});
  }
  host.innerHTML='';pdf.save('دليلك-الشامل-للتجارة-الإلكترونية.pdf');
 }catch(e){console.error(e);alert('تعذّر إنشاء الملف، حاول مرة أخرى.')}
 btn.disabled=false;btn.innerHTML=old;
};
